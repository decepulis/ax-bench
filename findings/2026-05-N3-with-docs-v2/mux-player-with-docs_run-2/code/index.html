<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ax-bench</title>
  </head>
  <body>
    <template id="theme-youtube">
      <style>
        media-controller {
          color: #fff;
          font-family: "Roboto", "Arial", sans-serif;
          width: 100%;
          background: #000;
        }

        media-time-range {
          --media-range-bar-color: #ff0000;
          --media-range-track-background: rgba(255, 255, 255, 0.3);
          --media-range-track-color: rgba(255, 255, 255, 0.5);
          --media-range-thumb-background: #ff0000;
          --media-range-thumb-width: 13px;
          --media-range-thumb-height: 13px;
          --media-control-height: 4px;
          --media-control-background: transparent;
          --media-control-hover-background: transparent;
          --media-preview-background: rgba(28, 28, 28, 0.9);
          --media-preview-time-background: transparent;
          width: 100%;
          height: 5px;
          padding: 0;
        }

        media-control-bar {
          background: rgba(0, 0, 0, 0.5);
          --media-control-background: transparent;
          --media-control-hover-background: rgba(255, 255, 255, 0.12);
          align-items: center;
          padding: 0 4px;
          height: 36px;
        }

        media-volume-range {
          --media-range-bar-color: #fff;
          --media-range-track-background: rgba(255, 255, 255, 0.3);
          --media-range-thumb-background: #fff;
          width: 60px;
        }

        media-time-display {
          color: #fff;
          font-size: 13px;
          font-variant-numeric: tabular-nums;
          padding: 0 6px;
        }

        media-play-button,
        media-seek-forward-button,
        media-mute-button,
        media-captions-button,
        media-pip-button,
        media-fullscreen-button,
        media-playback-rate-button {
          --media-control-background: transparent;
          --media-control-hover-background: rgba(255, 255, 255, 0.12);
          color: #fff;
        }

        .yt-title {
          color: #fff;
          font-size: 13px;
          margin-left: 10px;
          align-self: center;
          flex-shrink: 0;
        }

        .yt-autoplay {
          color: #fff;
          font-weight: 700;
          font-size: 14px;
          padding: 0 10px;
          line-height: 36px;
          opacity: 0.9;
        }

        .yt-spacer {
          flex: 1;
        }
      </style>
      <media-controller>
        <slot name="media" slot="media"></slot>
        <slot name="poster" slot="poster"></slot>
        <media-loading-indicator slot="centered-chrome" noautohide></media-loading-indicator>
        <media-time-range></media-time-range>
        <media-control-bar>
          <media-play-button></media-play-button>
          <media-seek-forward-button seekoffset="10"></media-seek-forward-button>
          <media-mute-button></media-mute-button>
          <media-volume-range></media-volume-range>
          <media-time-display showduration></media-time-display>
          <span class="yt-title">Two bros</span>
          <span class="yt-spacer"></span>
          <span class="yt-autoplay" role="switch" aria-checked="true" title="Autoplay">A</span>
          <media-captions-button></media-captions-button>
          <media-playback-rate-button></media-playback-rate-button>
          <media-pip-button></media-pip-button>
          <media-fullscreen-button></media-fullscreen-button>
        </media-control-bar>
      </media-controller>
    </template>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
